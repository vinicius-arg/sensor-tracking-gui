[tool.poetry]
name = "zenithgui"
version = "0.1.0"
description = ""
authors = ["vinicius-arg <j.vin7cius@gmail.com>", "Jvictor-19 <victor.pereira@dcomp.ufs.br>"]
readme = "README.md"
packages = [{ include = "zenithgui", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
pyqt5 = "^5.15.11"
pyqtgraph = "^0.13.7"
pyserial = "^3.5"
pandas = "^2.3.3"

[tool.poetry.scripts]
zenithgui = "zenithgui.main:main"
serial_test = "zenithgui.communication.serial_simulation:main"
csv_test = "zenithgui.util.write_csv:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
